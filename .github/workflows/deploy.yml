name: Deploy to GitHub Pages

# Temporary preview deployment for client review — see astro.config.mjs
# (GITHUB_PAGES env var) for how this differs from the real production
# build.
#
# One-time manual step required before the first run: the GITHUB_TOKEN
# cannot create a Pages site via the API (fails with "Resource not
# accessible by integration"), so someone with admin on this repo must
# visit Settings → Pages → Build and deployment → Source, and pick
# "GitHub Actions" once. After that, this workflow handles every deploy.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build
        env:
          GITHUB_PAGES: "true"

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
