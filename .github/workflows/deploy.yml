name: Deploy to GitHub Pages

# Temporary preview deployment for client review — see astro.config.mjs
# (GITHUB_PAGES env var) for how this differs from the real production
# build.
#
# One-time manual step required before the first run: the GITHUB_TOKEN
# cannot create a Pages site via the API (fails with "Resource not
# accessible by integration"), so someone with admin on this repo must
# visit Settings → Pages → Build and deployment → Source, and pick
# "GitHub Actions" once. After that, this workflow handles every deploy.

on:
  push:
    branches: [main]
    # Only files that affect the built site; docs-only pushes skip the deploy.
    paths:
      - "src/**"
      - "public/**"
      - "astro.config.mjs"
      - "tsconfig.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # pnpm is read from devEngines in package.json; keep node-version below
      # in line with it. Actions are pinned to commit SHAs.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build
        env:
          GITHUB_PAGES: "true"

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
